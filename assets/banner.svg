<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260" role="img" aria-labelledby="t d">
  <title id="t">Wilson's Lawn AI Assistant</title>
  <desc id="d">Voice and chat for lawn care scheduling and quotes The picture: a sun held by an open circle, and 5 waves drawing in beneath it. With reduced motion, the finished picture shows at once.</desc>
  <style>
    /* Motion only for readers who have not asked for less. Outside this block everything is in its finished state. */
    @media (prefers-reduced-motion: no-preference) {
      .draw { stroke-dasharray: 100; animation: draw 2.6s cubic-bezier(.4,0,.2,1) both; }
      .arrive { animation: arrive .5s ease-out both; }
      .breathe { transform-box: fill-box; transform-origin: center; animation: breathe 8s steps(48) 3s infinite; }
      .halo { transform-box: fill-box; transform-origin: center; animation: halo 5s steps(60) 3.6s infinite; }
    }
    @keyframes draw { from { stroke-dashoffset: 100 } to { stroke-dashoffset: 0 } }
    @keyframes arrive { from { opacity: 0 } to { opacity: 1 } }
    @keyframes breathe { 0%, 100% { transform: scale(1) } 50% { transform: scale(1.07) } }
    @keyframes halo { 0% { opacity: .55; transform: scale(1) } 70%, 100% { opacity: 0; transform: scale(2.1) } }
    .halo { opacity: 0 }
  </style>
  <defs>
    <linearGradient id="ground" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0e1c1b"/><stop offset="1" stop-color="#0b141a"/></linearGradient>
    <linearGradient id="line" gradientUnits="userSpaceOnUse" x1="668" y1="0" x2="1160" y2="0"><stop offset="0.00" stop-color="#2f6b3a"/><stop offset="0.50" stop-color="#7cb342"/><stop offset="1.00" stop-color="#bbd899"/></linearGradient>
    <linearGradient id="fade" gradientUnits="userSpaceOnUse" x1="620" y1="0" x2="1200" y2="0"><stop offset="0" stop-color="#7cb342" stop-opacity="0"/><stop offset=".35" stop-color="#7cb342"/><stop offset="1" stop-color="#bbd899"/></linearGradient>
    <clipPath id="card"><rect width="1200" height="260" rx="18"/></clipPath>
  </defs>
  <g clip-path="url(#card)">
    <!-- an opaque ground: the same picture on GitHub's light and dark themes -->
    <rect width="1200" height="260" fill="url(#ground)"/>
    <circle class="breathe" cx="888.9" cy="97.0" r="46" fill="url(#line)"/>
    <path class="draw" pathLength="100" d="M945.3 62.7A66 66 0 1 1 887.4 31.0" fill="none" stroke="#7cb342" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" style="animation-delay:0.20s"/>
    <path class="draw" pathLength="100" d="M620 164.0Q696.2 148.6 772.5 164.0Q848.7 179.4 925.0 164.0Q1001.2 148.6 1077.4 164.0Q1153.7 179.4 1229.9 164.0Q1306.2 148.6 1382.4 164.0" fill="none" stroke="url(#fade)" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" style="animation-delay:0.40s"/>
    <path class="draw" pathLength="100" d="M620 178.5Q690.7 195.0 761.4 178.5Q832.1 162.0 902.8 178.5Q973.5 195.0 1044.2 178.5Q1114.9 162.0 1185.6 178.5Q1256.3 195.0 1327.0 178.5" fill="none" stroke="url(#fade)" stroke-width="2.8000000000000003" stroke-linecap="round" stroke-linejoin="round" style="animation-delay:0.90s"/>
    <path class="draw" pathLength="100" d="M620 193.0Q682.4 176.5 744.8 193.0Q807.1 209.5 869.5 193.0Q931.9 176.5 994.3 193.0Q1056.6 209.5 1119.0 193.0Q1181.4 176.5 1243.8 193.0" fill="none" stroke="url(#fade)" stroke-width="2.4000000000000004" stroke-linecap="round" stroke-linejoin="round" style="animation-delay:1.40s"/>
    <path class="draw" pathLength="100" d="M620 207.5Q694.1 187.7 768.1 207.5Q842.2 227.3 916.3 207.5Q990.3 187.7 1064.4 207.5Q1138.5 227.3 1212.5 207.5Q1286.6 187.7 1360.6 207.5" fill="none" stroke="url(#fade)" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round" style="animation-delay:1.90s"/>
    <path class="draw" pathLength="100" d="M620 222.0Q683.5 204.0 747.0 222.0Q810.5 240.0 874.0 222.0Q937.5 204.0 1001.0 222.0Q1064.5 240.0 1128.0 222.0Q1191.4 204.0 1254.9 222.0" fill="none" stroke="url(#fade)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" style="animation-delay:2.40s"/>
    <rect x="0.0" y="248" width="300.5" height="12" fill="#14301c"/><rect x="300.0" y="248" width="300.5" height="12" fill="#2f6b3a"/><rect x="600.0" y="248" width="300.5" height="12" fill="#7cb342"/><rect x="900.0" y="248" width="300.5" height="12" fill="#eef7e0"/>
    <g font-family="Helvetica Neue, Helvetica, Arial, sans-serif"><text x="56" y="83.2" fill="#7cb342" font-size="15" font-weight="700" letter-spacing=".6">drasticstatic lab</text><text x="56" y="129.6" fill="#eef7e0" font-size="40" font-weight="700" letter-spacing="-.5">Wilson's Lawn AI Assistant</text><text x="56" y="170.2" fill="#cfd8c4" font-size="23">Voice and chat for lawn care scheduling and quotes</text></g>
  </g>
</svg>
